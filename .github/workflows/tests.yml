name: CI (Pint & Tests)

on:
  push:
    branches:
      - master
      - main
      - '*.x'
  pull_request:
    branches:
      - master
      - main
      - '*.x'

permissions:
  contents: read

jobs:
  code-style:
    name: Code Style (Laravel Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint Check
        run: vendor/bin/pint --test

  tests:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest
    needs: [code-style]
    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Verify TypeScript Drift
        run: php artisan types:generate --check

      - name: Execute tests
        run: php artisan test
